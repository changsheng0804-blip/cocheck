[project]
name = "cocheck"
version = "0.1.0"
description = "AI 智能审核：反射层体检 + 点名复核 + 统一模型接入口（本地/云端模型同一套 /v1 接口）"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
check = ["numpy", "pillow"]
local = ["numpy", "pillow", "torch", "sentence-transformers>=6", "transformers>=5"]
tts = ["edge-tts"]

[project.scripts]
cocheck = "cocheck.cli:main"

[tool.setuptools.packages.find]
include = ["cocheck*"]
