[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cocheck"
version = "0.1.0"
description = "AI 智能审核：反射层体检 + 点名复核 + 统一模型接入口（本地/云端模型同一套 /v1 接口）"
requires-python = ">=3.9"
dependencies = ["numpy", "pillow"]

[project.optional-dependencies]
check = []
local = ["torch", "sentence-transformers>=6", "transformers>=5"]
tts = ["edge-tts"]

[project.scripts]
cocheck = "cocheck.cli:main"

[tool.setuptools.packages.find]
include = ["cocheck*"]

[tool.setuptools.package-data]
cocheck = ["web/*.js"]
