[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cocheck"
version = "0.1.0"
description = "AI 智能审核：反射层体检 + 点名复核 + 统一模型接入口（本地/云端模型同一套 /v1 接口）"
requires-python = ">=3.9"
dependencies = ["numpy", "pillow"]

[project.optional-dependencies]
check = []
# 苹果芯片 Mac 只装 MLX（不装 torch）；其他机器装 torch。也可显式选 [mlx] / [torch]
local = ["mlx-vlm>=0.7.7; sys_platform == \"darwin\" and platform_machine == \"arm64\"", "torch; sys_platform != \"darwin\" or platform_machine != \"arm64\"", "sentence-transformers>=6; sys_platform != \"darwin\" or platform_machine != \"arm64\"", "transformers>=5"]
mlx = ["mlx-vlm>=0.7.7", "transformers>=5"]
torch = ["torch", "sentence-transformers>=6", "transformers>=5"]
tts = ["edge-tts"]

[project.scripts]
cocheck = "cocheck.cli:main"

[tool.setuptools.packages.find]
include = ["cocheck*"]

[tool.setuptools.package-data]
cocheck = ["web/*.js"]
